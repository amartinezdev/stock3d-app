  <title>Stock3D · Gestión de filamento</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gestión de stock de filamento para impresión 3D: inventario, rollos abiertos, ventas e histórico.">
  <meta name="theme-color" content="#09090b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237c5cff' stroke-width='2' stroke-linecap='round'><circle cx='12' cy='12' r='8'/><circle cx='12' cy='12' r='3'/><path d='M12 4v3M12 17v3'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    // Se aplica el tema ANTES de pintar nada para que no haya un
    // "flashazo" blanco al recargar con el tema oscuro guardado.
    (function () {
      try {
        var guardado = localStorage.getItem('stock3d.tema');
        document.documentElement.classList.toggle('dark', guardado !== 'claro');
      } catch (e) { /* localStorage bloqueado: se queda el tema oscuro por defecto */ }
    })();
  </script>
</head>
