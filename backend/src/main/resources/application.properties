spring.application.name=stock-api

# Todo lo que cambia entre el portátil y el servidor sale a variables de
# entorno, con el valor de desarrollo como respaldo tras los dos puntos.
# Así el mismo .jar vale para los dos sitios y no hay ni un secreto en git.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# validate (no update): Hibernate comprueba que las tablas coinciden con las
# entidades, pero no las modifica. Quien crea y versiona el esquema es
# Flyway, con sus migraciones - la única forma de saber en qué estado está
# la base de datos de producción.
spring.jpa.hibernate.ddl-auto=validate

# Cierra la sesión de Hibernate al salir del Service, sin arrastrarla hasta
# la vista. Evita consultas sueltas al serializar y quita el aviso de
# arranque "spring.jpa.open-in-view is enabled by default".
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}

# Orígenes que pueden llamar a la API desde un navegador. En producción el
# frontend se sirve desde el MISMO dominio que la API (el proxy inverso
# reparte /api), así que allí esta lista puede quedarse vacía.
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
