# Perfil de producción: se activa con SPRING_PROFILES_ACTIVE=prod.

# La documentación interactiva es una herramienta de desarrollo: publicarla
# es regalar el mapa completo de la API a cualquiera que pase por ahí.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Nada de SQL en los logs: es ruido, ocupa disco y puede acabar imprimiendo
# datos de las personas usuarias.
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN

# Ante un error, el cliente recibe el ErrorResponse de GlobalExceptionHandler
# y nada más: ni traza ni nombres de clases internas.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Detrás de un proxy inverso: sin esto Spring cree que todo llega por HTTP
# plano y genera mal las URLs absolutas.
server.forward-headers-strategy=framework
